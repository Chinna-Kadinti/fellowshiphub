services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fellowshiphub
      POSTGRES_USER: fellowshiphub
      POSTGRES_PASSWORD: fellowshiphub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fellowshiphub -d fellowshiphub"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fellowshiphub:fellowshiphub@db:5432/fellowshiphub?schema=public
      JWT_SECRET: change-this-secret-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MOBILE_ALLOWED_ORIGINS: capacitor://localhost,https://localhost,http://localhost,http://localhost:5173,http://127.0.0.1:5173
      SEED_DATABASE: "true"
      SEED_ADMIN_PASSWORD: Admin@123456
      SEED_MEMBER_PASSWORD: Member@123456
    ports:
      - "3000:3000"

volumes:
  postgres_data:
